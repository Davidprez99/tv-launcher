plugins {
    id 'com.android.application'
}

android {
    namespace 'com.terry.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.terry.home'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: plain framework APIs start fastest.
